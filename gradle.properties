# Project-wide Gradle settings. Settings configured through the IDE override this file.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# DJI App Key placeholder. THIS FILE IS PUBLIC -- never put a real key here.
#
# A key is bound to the applicationId it was issued against, so this app's key would not work for
# your build anyway. Request your own at https://developer.dji.com for your own package name, then
# put it in local.properties (gitignored), which overrides this value:
#
#     AIRCRAFT_API_KEY=your_key_here
#
# Without a valid key the app installs and launches, but SDK registration fails and no aircraft is
# ever visible -- and the failure looks like a cable or pairing problem, not a missing key.
AIRCRAFT_API_KEY=Please add your app key here.

# Host for the built-in publish URLs shown in the app's Select list. Left at loopback here on
# purpose: THIS FILE IS PUBLIC, and a LAN address is a local detail, not something to commit.
#
# Point it at wherever your SRS is actually running, in local.properties (gitignored):
#
#     PUBLISH_HOST=192.168.1.100
#
# The default is not a working server -- from the phone, 127.0.0.1 is the phone. It is a template
# to edit, and the address must be one the phone can reach, which rules out the server's own
# loopback and, for WHIP, must match the CANDIDATE that SRS advertises or ICE will not connect.
PUBLISH_HOST=127.0.0.1
